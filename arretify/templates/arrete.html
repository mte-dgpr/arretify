<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8" />
        <link href="https://cdn.jsdelivr.net/npm/@gouvfr/dsfr@1.13.0/dist/dsfr.css" rel="stylesheet" />
        <style>
            :root {
                --spacing-1: 1rem;
                --spacing-0p5: 0.5rem;
            }

            header, main, footer {
                max-width: 800px;
                margin: auto;
                padding: var(--spacing-1);
            }

            blockquote {
                border-left: 1px solid var(--border-plain-grey);
                padding-left: var(--spacing-1);
            }

            table {
                border-collapse: collapse
            }

            th {
                text-align: left;
            }

            td, th {
                border: solid 1px #cecece;
                padding: 0.5rem;
            }

            a.arretify-document_reference, a.arretify-section_reference {
                color: var(--text-action-high-blue-france);
            }

            *[data-error_codes] {
                font-family: monospace;
                background-color: #ffd0d0 !important;
            }

            .arretify-alinea::before, .arretify-visa::before, .arretify-motifs::before {
                color: var(--text-disabled-grey);
                position: absolute;
                top: 0;
                left: -1rem;
            }

            .arretify-debug_keyword {
                color: var(--warning-425-625);
            }

            .arretify-visual_page_separator {
                position: absolute;
                left: 0;
                width: 100vw;
                height: 0.3em;
                background-color: var(--grey-950-100);
                z-index: -1;
            }

            a.arretify-visual_page_separator > span {
                position: absolute;
                font-size: 75%;
                color: var(--grey-625-425);
            }

            /**************** HEADER ****************/
            header {
                padding-bottom: var(--spacing-1);
                margin-bottom: var(--spacing-1);
            }

            .arretify-emblem, .arretify-entity, .arretify-identification, .arretify-arrete_title, .arretify-honorary {
                padding: var(--spacing-1);
                background-color: var(--background-alt-grey);
                text-align: center;
            }

            .arretify-arrete_title {
                color: var(--text-title-grey);
            }

            .arretify-emblem, .arretify-entity, .arretify-identification, .arretify-honorary {
                color: var(--text-title-blue-france);
                font-size: 120%;
            }

            .arretify-visa, .arretify-motifs, .arretify-supplementary_motif_info, .arretify-table_of_contents {
                position: relative;
                margin-top: var(--spacing-1);
                padding-bottom: 0;
            }

            .arretify-visa::before, .arretify-motifs::before {
                content: '⮞';
            }

            header > *:last-child {
                border-bottom: 1px solid var(--background-action-low-blue-france);
                padding-bottom: var(--spacing-1);
            }

            /**************** MAIN CONTENT AND APPENDIX ****************/
            .arretify-table {
                font-family: monospace;
            }

            .arretify-section {
                padding: var(--spacing-0p5) 0;
            }

            .arretify-alinea {
                position: relative;
                margin-top: var(--spacing-0p5);
            }

            .arretify-alinea::before {
                content: '¶';
            }

            .arretify-alinea img {
                max-width: 100%;
            }

            ul, ol { 
                list-style: none;
            }

            .arretify-operation {
                background-color: var(--background-action-low-blue-france);
            }
        </style>
        <script>
            window.onload = function() {
                // Page separators are inline elements, so they can be anywhere in the tree.
                // To ensure proper layout, we therefore create a separate visual element
                // for each page separator.
                const pageSeparators = Array.from(document.querySelectorAll('.arretify-page_separator'))
                
                const refreshPageSeparator = () => {
                    document.querySelectorAll('.arretify-visual_page_separator')
                        .forEach((visualPageSeparator) => visualPageSeparator.remove())
                    pageSeparators.slice(1).forEach(function(pageSeparator) {
                        const boundingBox = pageSeparator.getBoundingClientRect()
                        const position = getPositionRelativeToDocument(pageSeparator)
                        const pageIndex = parseInt(pageSeparator.dataset.page_index, 10)
                        const visualPageSeparator = document.createElement('a')
                        visualPageSeparator.classList.add('arretify-visual_page_separator')
                        visualPageSeparator.style.top = `${position.top + boundingBox.height}px`
                        visualPageSeparator.innerHTML = `<span>↓ page ${pageIndex + 1}</span>`
                        document.body.appendChild(visualPageSeparator)
                    })
                }

                refreshPageSeparator()
                window.addEventListener('resize', refreshPageSeparator)
            }

            const getPositionRelativeToDocument = (el) => {
                const rect = el.getBoundingClientRect()
                return {
                    left: rect.left + window.scrollX,
                    top: rect.top + window.scrollY,
                }
            }
        </script>
    </head>
    <body>
    </body>
</html>
